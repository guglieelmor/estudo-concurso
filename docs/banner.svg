<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 120 1200 280" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a44"/>
      <stop offset="1" stop-color="#1b4d6b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f5b942"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect y="120" width="1200" height="280" rx="20" fill="url(#bg)"/>

  <!-- decorative grid dots -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="1080" cy="50" r="90"/>
    <circle cx="120" cy="400" r="70"/>
  </g>


  <!-- step 1: edital -->
  <g transform="translate(60,160)" filter="url(#shadow)">
    <rect width="210" height="200" rx="16" fill="#ffffff"/>
    <!-- pdf page -->
    <g transform="translate(70,22)">
      <path d="M0 0 H52 L70 18 V88 H0 Z" fill="#fdeaea" stroke="#d64545" stroke-width="2"/>
      <path d="M52 0 V18 H70" fill="none" stroke="#d64545" stroke-width="2"/>
      <rect x="10" y="58" width="50" height="20" rx="4" fill="#d64545"/>
      <text x="35" y="73" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">PDF</text>
      <rect x="10" y="26" width="38" height="4" rx="2" fill="#e8a3a3"/>
      <rect x="10" y="36" width="48" height="4" rx="2" fill="#e8a3a3"/>
      <rect x="10" y="46" width="30" height="4" rx="2" fill="#e8a3a3"/>
    </g>
    <text x="105" y="145" font-size="20" font-weight="700" fill="#0f2a44" text-anchor="middle">Edital</text>
    <text x="105" y="170" font-size="14" fill="#55697a" text-anchor="middle">arquivo ou link</text>
  </g>

  <line x1="282" y1="260" x2="326" y2="260" stroke="#f5b942" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 2: resumo -->
  <g transform="translate(340,160)" filter="url(#shadow)">
    <rect width="210" height="200" rx="16" fill="#ffffff"/>
    <g transform="translate(55,24)">
      <rect width="100" height="86" rx="8" fill="#e8f1fa" stroke="#2f6f9f" stroke-width="2"/>
      <rect x="12" y="14" width="40" height="6" rx="3" fill="#2f6f9f"/>
      <rect x="12" y="30" width="76" height="5" rx="2.5" fill="#9cc0dd"/>
      <rect x="12" y="42" width="60" height="5" rx="2.5" fill="#9cc0dd"/>
      <rect x="12" y="54" width="70" height="5" rx="2.5" fill="#9cc0dd"/>
      <rect x="12" y="66" width="48" height="5" rx="2.5" fill="#9cc0dd"/>
    </g>
    <text x="105" y="145" font-size="20" font-weight="700" fill="#0f2a44" text-anchor="middle">Resumo</text>
    <text x="105" y="170" font-size="14" fill="#55697a" text-anchor="middle">matérias, pesos, data</text>
  </g>

  <line x1="562" y1="260" x2="606" y2="260" stroke="#f5b942" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 3: cronograma -->
  <g transform="translate(620,160)" filter="url(#shadow)">
    <rect width="210" height="200" rx="16" fill="#ffffff"/>
    <g transform="translate(55,22)">
      <rect width="100" height="90" rx="8" fill="#fff7e6" stroke="#d99a1e" stroke-width="2"/>
      <rect width="100" height="22" rx="8" fill="#f5b942"/>
      <rect y="14" width="100" height="8" fill="#f5b942"/>
      <rect x="22" y="-6" width="6" height="14" rx="3" fill="#0f2a44"/>
      <rect x="72" y="-6" width="6" height="14" rx="3" fill="#0f2a44"/>
      <g fill="#f0d49a">
        <rect x="10" y="32" width="16" height="14" rx="3"/><rect x="32" y="32" width="16" height="14" rx="3"/>
        <rect x="54" y="32" width="16" height="14" rx="3"/><rect x="76" y="32" width="16" height="14" rx="3"/>
        <rect x="10" y="52" width="16" height="14" rx="3"/><rect x="32" y="52" width="16" height="14" rx="3"/>
        <rect x="76" y="52" width="16" height="14" rx="3"/>
        <rect x="10" y="72" width="16" height="12" rx="3"/><rect x="32" y="72" width="16" height="12" rx="3"/>
      </g>
      <rect x="54" y="52" width="16" height="14" rx="3" fill="#d64545"/>
    </g>
    <text x="105" y="145" font-size="20" font-weight="700" fill="#0f2a44" text-anchor="middle">Cronograma</text>
    <text x="105" y="170" font-size="14" fill="#55697a" text-anchor="middle">até o dia da prova</text>
  </g>

  <line x1="842" y1="260" x2="886" y2="260" stroke="#f5b942" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- step 4: dias (stacked cards) -->
  <g transform="translate(900,160)">
    <rect x="16" y="-14" width="210" height="200" rx="16" fill="#ffffff" opacity="0.35"/>
    <rect x="8" y="-7" width="210" height="200" rx="16" fill="#ffffff" opacity="0.6"/>
    <g filter="url(#shadow)">
      <rect width="210" height="200" rx="16" fill="#ffffff"/>
      <text x="105" y="40" font-size="18" font-weight="800" fill="#0f2a44" text-anchor="middle">Dia 001</text>
      <g font-size="15" fill="#0f2a44">
        <circle cx="40" cy="72" r="9" fill="#2f6f9f"/><text x="58" y="77">conteúdo</text>
        <circle cx="40" cy="102" r="9" fill="#f5b942"/><text x="58" y="107">simulado</text>
        <circle cx="40" cy="132" r="9" fill="#3a9d6a"/><text x="58" y="137">gabarito</text>
      </g>
      <path d="M35 132 l4 4 l7 -8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="105" y="178" font-size="14" fill="#55697a" text-anchor="middle">um por dia de estudo</text>
    </g>
  </g>
</svg>
