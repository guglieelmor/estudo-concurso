# Modelo copiado pela skill notifica-concurso para o repositório privado do candidato (.github/workflows/).
name: notificador de concursos

on:
  schedule:
    - cron: "0 11,21 * * *" # 08h e 18h em Brasília
  workflow_dispatch:

concurrency: notificador

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lista de vistos vive no cache, não em commit. Cache perdido = semeia de novo sem notificar.
      - uses: actions/cache/restore@v4
        with:
          path: vistos.txt
          key: vistos-${{ github.run_id }}
          restore-keys: vistos-

      - run: python3 notificador.py
        env:
          USUARIOS: ${{ secrets.USUARIOS }}

      - uses: actions/cache/save@v4
        with:
          path: vistos.txt
          key: vistos-${{ github.run_id }}
